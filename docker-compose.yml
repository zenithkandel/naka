version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: bordervision-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bordervision
      POSTGRES_USER: bv_admin
      POSTGRES_PASSWORD: bv_secure_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bv_admin -d bordervision"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bordervision-vectors
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

volumes:
  pg_data:
  qdrant_data:
